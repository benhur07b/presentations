/* ===============================================================
   Reveal.js layout mechanics shared by every style
   ===============================================================
   The build puts this file before the style's theme.css. It holds only how slides
   sit on reveal.js's 1920x1080 canvas, never colour or type; a theme sets
   --slide-padding, --page-light and --page-dark. Why each rule is here:
   references/reveal-layout-guide.md.
   =============================================================== */

/* reveal.js mirrors section classes onto .slide-background elements, so the page
   colour of each slide type is set on its background */
.reveal .slide-background .slide-background-content {
  background-color: var(--page-light);
}

.reveal .slide-background.title-slide .slide-background-content,
.reveal .slide-background.section-slide .slide-background-content,
.reveal .slide-background.subsection-slide .slide-background-content {
  background-color: var(--page-dark);
}

/* display: flex is set via Reveal config (display: 'flex').
   center: false prevents reveal.js from injecting inline top offsets.
   Sections size to content by default — do NOT set height: 100% here
   as it triggers reveal.js's overflow stacking algorithm on content
   slides. Dark slide types (title, section, subsection) set height: 100%
   in the theme since they have simple layouts that need full-viewport
   vertical positioning (margin-top: auto, justify-content).
   top: 0 anchors slides to the top — without it, position: absolute
   with top: auto places sections at their "static position", which
   shifts down based on preceding siblings in the DOM. */
.reveal .slides section {
  text-align: left;
  padding: var(--slide-padding);
  box-sizing: border-box;
  flex-direction: column;
  top: 0;
}

/* Lists: the theme draws its own markers in li::before */
.reveal .slides section ul,
.reveal .slides section ol {
  margin: 0;
  padding-left: 0;
  list-style: none;
}

.reveal .slides section ul li,
.reveal .slides section ol li {
  position: relative;
}

/* The footer: the build's script draws it into every light slide (never a dark one), so it
   scales and moves with the slide's canvas at any window size. A content slide is only as tall
   as its content, so the footer is placed from the canvas's top: its foot sits
   --footer-bottom above the canvas's bottom edge. */
.global-footer {
  --footer-bottom: 40px;
  position: absolute;
  top: calc(1080px - var(--footer-bottom));
  transform: translateY(-100%);
  left: 56px;
  right: 56px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
  pointer-events: none;
}

.global-footer .page-number {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

/* A slide's <bnhr-timer>: the build's script moves it into the footer, where it takes the middle (the page
   number's place, which gives way to it) and sits on the footer's foot */
.global-footer bnhr-timer {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
}

.global-footer:has(bnhr-timer) .page-number {
  display: none;
}

@media print {
  .reveal .slides section {
    page-break-inside: avoid;
  }
}


/* BNHR 2026 web tokens: the brand's colours and type for every BNHR website, in no framework's terms.

   Each site copies this folder into its own source with its sync script and commits the copy, so a build never
   reaches outside the site's repo; never edit a copy, change this file and sync. A site maps these tokens onto its
   framework in its own adapter (Learn QGIS: src/styles/brand.css, for Starlight), and keeps tokens only it uses
   (QGIS green, its terrain) in that adapter. Two colourways from the logo (open_frame.py PALETTES): core-dark, the
   navy page, and core-light, the paper page. A site's adapter picks one for each of its themes.

   The tones per colourway are given as colours, not mixes, so a contrast check can measure them as written:
   `ink` is text and headings; `muted` is secondary text (the ink 86% over the page); `subtle` is labels and
   captions; `rule` and `hair` are the lines that frame panels and divide rows (decorative, never text).
   `block` and `mark` are the highlight pair: the mark colour on the orange block (8.6:1), the same in both. */

:root {
	--bnhr-navy: #0c2340;
	--bnhr-paper: #f5f5f5;
	--bnhr-orange: #ffa500;
	--bnhr-white: #ffffff;
	/* Hazard yellow, for cautions only */
	--bnhr-hazard: #ffd400;

	--bnhr-block: var(--bnhr-orange);
	--bnhr-mark: var(--bnhr-navy);

	--core-dark-bg: #0c2340;
	--core-dark-surface: #10294a;
	--core-dark-ink: #f5f5f5;
	--core-dark-muted: #d3dbe6;
	--core-dark-subtle: #a3b3c9;
	--core-dark-rule: #3f5168;
	--core-dark-hair: #283c56;

	--core-light-bg: #f5f5f5;
	--core-light-surface: #ffffff;
	--core-light-ink: #0c2340;
	--core-light-muted: #23324a;
	--core-light-subtle: #4a5a70;
	--core-light-rule: #c2c7cd;
	--core-light-hair: #d9dcdf;

	/* Albert Sans for display (700–800, tight negative tracking), Atkinson Hyperlegible Next for reading,
	   Atkinson Hyperlegible Mono for kickers, labels and data. The faces are in fonts.css. */
	--bnhr-font-display: 'Albert Sans', sans-serif;
	--bnhr-font-text: 'Atkinson Hyperlegible Next', sans-serif;
	--bnhr-font-mono: 'Atkinson Hyperlegible Mono', monospace;

	/* The logo's corner ratio, (R + SW/2) / frame size, for blocks and cards that echo it */
	--bnhr-radius-ratio: 0.134;
}

.reveal .slides section.subsection-slide use.major { stroke: var(--ink); stroke-width: 2.8; stroke-opacity: .95; }
.reveal .slides section.subsection-slide use.minor { stroke: var(--ink); stroke-width: 1.6; stroke-opacity: .75; }
.reveal .slides section.subsection-slide use.street { stroke: var(--ink); stroke-width: .8; stroke-opacity: .5; }
.reveal .slides section.subsection-slide use.path { stroke: var(--ink); stroke-width: .7; stroke-opacity: .35; stroke-dasharray: 2 2; }

.sheet .frame { position: absolute; left: 64px; top: 72px; width: 1792px; height: 924px; border: 3px solid var(--ink); overflow: hidden; }
.sheet .terrain { position: absolute; inset: -3px; width: 1792px; height: 924px; color: var(--ink); }
.sheet .graticule { stroke: var(--ink); stroke-opacity: .16; stroke-width: 1.2; stroke-dasharray: 2 6; }
.sheet .coast path { stroke: var(--ink); stroke-width: 1.6; stroke-opacity: .85; }
.sheet .relief path { stroke: var(--ink); }
.sheet .relief path.int { stroke-width: .9; stroke-opacity: .32; }
.sheet .relief path.idx { stroke-width: 1.8; stroke-opacity: .7; }
.sheet .tick { position: absolute; background: var(--ink); }
.sheet .lab, .sheet .imprint { position: absolute; font: 600 15px/1 var(--mono); letter-spacing: .06em; color: var(--ink); white-space: nowrap; text-transform: uppercase; }
.sheet .lab.x { transform: translateX(-50%); }
.sheet .lab.y { writing-mode: vertical-rl; transform: translateY(-50%) rotate(180deg); }
.sheet .imprint { font-weight: 500; color: var(--subtle); }
.sheet .unit, .sheet .probe b { text-transform: none; }  
.sheet .peak { position: absolute; display: flex; align-items: center; gap: 10px; transform: translate(-11px, -50%); }
.sheet .peak svg { width: 22px; height: 20px; fill: var(--block); stroke: var(--bg); stroke-width: 1.5; }
.sheet .peak span { background: color-mix(in srgb, var(--bg) 78%, transparent); padding: 5px 9px; border-radius: 4px; }
.sheet .peak b { display: block; font: 800 22px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.sheet .peak i { font: 500 16px/1.2 var(--mono); font-style: normal; color: var(--muted); }

.sheet .scale { position: absolute; display: flex; align-items: flex-end; gap: 22px; padding: 16px 20px 14px; border: 1.5px solid var(--rule);
  background: color-mix(in srgb, var(--bg) 84%, transparent); font: 500 15px/1 var(--mono); letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
.sheet .north { width: 34px; height: 58px; color: var(--ink); }
.sheet .bar { display: flex; height: 11px; border: 1.5px solid var(--ink); margin: 2px 0 8px; }
.sheet .bar i { flex: 1; }
.sheet .bar i:nth-child(odd) { background: var(--ink); }
.sheet .bar-labels { position: relative; height: 16px; color: var(--ink); text-transform: none; }  
.sheet .bar-labels span { position: absolute; left: 0; }
.sheet .bar-labels span:last-child { left: 100%; transform: translateX(-50%); white-space: nowrap; }
.sheet .probe { display: grid; gap: 7px; margin-top: 10px; padding-top: 10px; border-top: 1.5px solid var(--rule); white-space: nowrap; }
.sheet .probe b { color: var(--ink); font-weight: 700; }
.sheet .probe-mark { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; color: var(--ink); }
.sheet .probe-mark::before { content: ''; position: absolute; inset: 0;
  background: linear-gradient(currentColor, currentColor) center / 2px 100% no-repeat, linear-gradient(currentColor, currentColor) center / 100% 2px no-repeat; }
.sheet .probe-mark::after { content: ''; position: absolute; inset: 13px; border-radius: 50%; background: var(--ink); border: 3px solid var(--bg); }


/* ===============================================================
   BNHR 2026 deck style (style: 2026)
   ===============================================================
   The 2026 brand on reveal.js, from the NbS consultation workshop deck (21 Oct 2026):
   navy, paper and the orange highlight block; Albert Sans ExtraBold headlines in
   sentence case; Atkinson Hyperlegible Next for reading and Atkinson Hyperlegible
   Mono for kickers, labels and code; corners that follow the logo's. Other colours
   carry meaning only: the category colours below, and what a deck defines for itself.

   The build inlines before this file: ../base.css (layout mechanics), the web kit's
   tokens.css and fonts (assets/brand-2026, from branding/web-2026; never edit them
   here), the logos as --logo-<name>-<colourway>, and the deck's place. Sizes are pt
   on the 1920x1080 canvas.
   =============================================================== */

:root {
  --navy: var(--bnhr-navy);
  --paper: var(--bnhr-paper);
  --orange: var(--bnhr-orange);
  --surface: var(--core-light-surface);
  --muted: var(--core-light-muted);
  --subtle: var(--core-light-subtle);
  --rule: var(--core-light-rule);
  --hair: var(--core-light-hair);
  --muted-dark: var(--core-dark-muted);
  --subtle-dark: var(--core-dark-subtle);
  --hazard: var(--bnhr-hazard);
  --radius: 28px;

  --font-title: var(--bnhr-font-display);
  --font-body: var(--bnhr-font-text);
  --font-mono: var(--bnhr-font-mono);

  --fs-title-display: 112pt;
  --fs-title-section: 104pt;
  --fs-title-subsection: 72pt;
  --fs-title-slide: 58pt;
  --fs-subtitle: 34pt;
  --fs-body: 28pt;
  --fs-body-small: 22pt;
  --fs-kicker: 20pt;
  --fs-footer: 15pt;
  --fs-code: 21pt;

  --slide-padding: 72px 160px 140px 96px;
  --page-light: var(--paper);
  --page-dark: var(--navy);

  /* Category colours (proposed 2026-10-27, on review): five hues in a fixed order, for
     identity only (which series, which quadrant), never for meaning or status. Checked
     with the dataviz validator: every neighbour and the first three as all pairs clear
     the colour-blind (protan, deutan) and normal-vision floors, and each is 3:1 or more
     on paper; the -dark set is the same hues stepped for navy. */
  --cat-1: #1f68bc;  /* blue */
  --cat-2: #9a2f62;  /* rose */
  --cat-3: #499537;  /* green */
  --cat-4: #8f68cb;  /* violet */
  --cat-5: #a03317;  /* brick */
  --cat-1-dark: #337bd0;
  --cat-2-dark: #bb4e7f;
  --cat-3-dark: #5ba84a;
  --cat-4-dark: #956ed2;
  --cat-5-dark: #c25237;

  /* Diagram colours for the components (components/bnhr-00-viz.js) */
  --viz-ink: var(--navy);
  --viz-accent: var(--orange);
  --viz-on-accent: var(--navy);
  --viz-accent-light: var(--hair);
  --viz-accent-dot: var(--navy);
  --viz-pale: var(--surface);
  --viz-surface: var(--surface);
  --viz-muted: var(--subtle);
  --viz-axis: var(--muted);
  --viz-on-fill: #ffffff;
  --viz-font-mono: var(--font-mono);
  --viz-font-title: var(--font-title);
  --viz-cat-1: var(--cat-1);
  --viz-cat-2: var(--cat-2);
  --viz-cat-3: var(--cat-3);
  --viz-cat-4: var(--cat-4);
  --viz-cat-5: var(--cat-5);
  --viz-row-1: var(--cat-1);
  --viz-row-2: var(--cat-2);
  --viz-row-3: var(--cat-3);
  --viz-row-4: var(--cat-4);
  --viz-row-5: var(--cat-5);
  --viz-fanout-in: var(--navy);
  --viz-fanout-out: var(--cat-1);

  /* The code blocks' copy button */
  --copy-bg: var(--orange);
  --copied-bg: var(--paper);
  --copy-ink: var(--navy);
  --copied-ink: var(--navy);
}

/* =========================
   BASE
   ========================= */
.reveal {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  color: var(--navy);
  --ink: var(--navy);
  -webkit-font-smoothing: antialiased;
}

.reveal h1, .reveal h2, .reveal h3 {
  font-family: var(--font-title);
  font-weight: 800;
  text-transform: none;
  letter-spacing: -0.035em;
  color: inherit;
}

.reveal .slides section h3 {
  font-size: 34pt;
  letter-spacing: -0.02em;
  margin: 0 0 20px 0;
}

/* Highlight: navy on an orange block; the full stop sits outside it */
.reveal em, .reveal .hl {
  font-style: normal;
  color: var(--navy);
  background: var(--orange);
  padding: 0 0.12em;
  border-radius: 0.12em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* At line height 1 a highlighted line's block reaches into the line above it. The
   headline is its own stacking context and its highlight sits behind its text, so the
   line above keeps its descenders drawn over the block (the post kit's rule). */
.reveal h1, .reveal h2 { position: relative; z-index: 0; }
.reveal h1 em, .reveal h2 em { position: relative; z-index: -1; }

.reveal a { color: inherit; text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 0.12em; text-underline-offset: 0.16em; }
.reveal strong, .reveal b { font-weight: 700; }

/* Navy slides take the dark tones */
.reveal .slides section.title-slide,
.reveal .slides section.section-slide,
.reveal .slides section.subsection-slide {
  --ink: var(--paper);
  --muted: var(--core-dark-muted);
  --subtle: var(--core-dark-subtle);
  --rule: var(--core-dark-rule);
  --surface: var(--core-dark-surface);
  --viz-ink: var(--paper);
  --viz-cat-1: var(--cat-1-dark);
  --viz-cat-2: var(--cat-2-dark);
  --viz-cat-3: var(--cat-3-dark);
  --viz-cat-4: var(--cat-4-dark);
  --viz-cat-5: var(--cat-5-dark);
  --viz-surface: var(--core-dark-surface);
  --viz-pale: var(--core-dark-surface);
  background: var(--navy);
  color: var(--paper);
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 72px 96px 144px 96px;
}

/* The square logo on navy, top right */
.reveal .slides section.title-slide::after,
.reveal .slides section.section-slide::after,
.reveal .slides section.subsection-slide::after {
  content: "";
  position: absolute;
  top: 56px;
  right: 72px;
  width: 150px;
  height: 150px;
  background: var(--logo-logo-square-core-dark) center / contain no-repeat;
}

/* =========================
   KICKERS (mono, uppercase)
   ========================= */
.kicker,
.reveal .slides section .section-label,
.reveal .slides section.title-slide .project-context {
  font-family: var(--font-mono);
  font-size: var(--fs-kicker);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.2;
}

.reveal .slides section p.kicker {
  font-size: var(--fs-kicker);
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 0 30px 0;
}

/* =========================
   TITLE SLIDE
   ========================= */
.reveal .slides section.title-slide .project-context {
  color: var(--muted-dark);
  margin: 0 0 28px 0;
}

.reveal .slides section.title-slide h1 {
  font-size: var(--fs-title-display);
  line-height: 1;
  margin: 0 0 40px 0;
  max-width: 90%;
  color: var(--paper);
}

.reveal .slides section.title-slide .subtitle {
  font-size: var(--fs-subtitle);
  font-weight: 400;
  color: var(--muted-dark);
  margin: 0 0 8px 0;
}

.reveal .slides section.title-slide .tagline {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 26pt;
  color: var(--paper);
  margin: 36px 0 0 0;
}

.reveal .slides section.title-slide .tagline em {
  padding: 0 0.16em;
  border-radius: 0.14em;
}

/* =========================
   SECTION AND SUB-SECTION DIVIDERS
   ========================= */
.reveal .slides section.section-slide h1 {
  font-size: var(--fs-title-section);
  line-height: 1;
  margin: 0;
  max-width: 90%;
  color: var(--paper);
}

.reveal .slides section.section-slide .section-label,
.reveal .slides section.subsection-slide .section-label {
  display: block;
  color: var(--muted-dark);
  margin: 0 0 28px 0;
}

.reveal .slides section.subsection-slide {
  justify-content: center;
}

.reveal .slides section.subsection-slide h1 {
  font-size: var(--fs-title-subsection);
  line-height: 1.02;
  margin: 0;
  max-width: 80%;
  color: var(--paper);
}

/* =========================
   CONTENT SLIDE
   ========================= */
.reveal .slides section.content-slide,
.reveal .slides section.toc-slide {
  background: var(--paper);
  color: var(--navy);
}

.reveal .slides section.content-slide h2,
.reveal .slides section.toc-slide h2 {
  display: block;
  font-size: var(--fs-title-slide);
  line-height: 1.06;
  margin: 0 0 52px 0;
  max-width: 96%;
}

.reveal .slides section.content-slide .content { flex: 1; }

/* =========================
   TEXT
   ========================= */
.reveal .slides section p,
.reveal .slides section li {
  font-size: var(--fs-body);
  line-height: 1.38;
}

.reveal .slides section p { margin: 0 0 24px 0; }
.reveal .slides section p + ul,
.reveal .slides section p + ol { margin-top: 10px; }
.reveal .slides section ul + p,
.reveal .slides section ol + p { margin-top: 28px; }

.reveal .slides section ul li,
.reveal .slides section ol li {
  margin-bottom: 0.62em;
  padding-left: 1.3em;
}

/* Bullets are small orange blocks with the logo's corner */
.reveal .slides section ul li::before {
  content: "";
  position: absolute;
  left: 0.18em;
  top: 0.48em;
  width: 0.44em;
  height: 0.44em;
  background: var(--orange);
  border-radius: 0.09em;
}

.reveal .slides section ol { counter-reset: item; }
.reveal .slides section ol li { padding-left: 1.6em; }
.reveal .slides section ol li::before {
  counter-increment: item;
  content: counter(item) ".";
  position: absolute;
  left: 0;
  color: var(--navy);
  font-family: var(--font-title);
  font-weight: 800;
}

/* The big line of a column or card: a headline at body scale */
.reveal .slides section p.big-line {
  font-family: var(--font-title);
  font-weight: 800;
  font-size: 46pt;
  line-height: 1.05;
  letter-spacing: -0.03em;
  margin: 8px 0 22px 0;
}

/* =========================
   CONTENTS
   ========================= */
.reveal .slides section.toc-slide .toc-list { counter-reset: toc-item; }
.reveal .slides section.toc-slide .toc-list li {
  counter-increment: toc-item;
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 40pt;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 30px;
  padding-left: 2.1em;
}
.reveal .slides section.toc-slide .toc-list li::before {
  content: counter(toc-item, decimal-leading-zero);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.6em;
  letter-spacing: 0.04em;
  color: var(--muted);
  top: 0.38em;
}

/* =========================
   CARDS AND COLUMNS
   ========================= */
.two-column {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  flex: 1;
}
.two-column.split-2-1 { grid-template-columns: 2fr 1fr; }
.two-column.split-1-2 { grid-template-columns: 1fr 2fr; }

.reveal .two-column .column,
.card {
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--rule);
  border-radius: var(--radius);
  padding: 36px 48px 20px;
}

/* The column a slide is about: a navy ring instead of the rule */
.reveal .two-column .column.focus,
.card.focus { box-shadow: 0 0 0 5px var(--navy); }

.column-header {
  font-family: var(--font-mono);
  font-size: var(--fs-kicker);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--navy);
  margin-bottom: 26px;
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Chips: short labels in a row */
.chips { display: flex; flex-wrap: wrap; gap: 14px; }
.chips span { font-size: 25pt; padding: 10px 24px; border-radius: 999px; box-shadow: 0 0 0 2px var(--rule); background: var(--paper); }

/* Numbered cards: two by two, a big number beside each */
.numbered { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; margin-top: 8px; }
.numbered > div { background: var(--surface); box-shadow: 0 0 0 3px var(--rule); border-radius: var(--radius); padding: 52px 48px; display: flex; gap: 28px; align-items: flex-start; }
.numbered .n { flex: none; font-family: var(--font-title); font-weight: 800; font-size: 50pt; line-height: 0.9; }
.numbered .t { font-size: 28pt; line-height: 1.3; }
.numbered .t b { display: block; font-family: var(--font-title); font-weight: 800; font-size: 32pt; letter-spacing: -0.015em; margin-bottom: 6px; }

/* Milestones: dates in a row; .today is outlined, .last is navy */
.dates { display: grid; grid-template-columns: repeat(var(--n, 4), 1fr); gap: 28px; margin-top: 24px; }
.date-card { background: var(--surface); box-shadow: 0 0 0 3px var(--rule); border-radius: var(--radius); padding: 40px 40px 44px; }
.date-card .when { font-family: var(--font-title); font-weight: 800; font-size: 50pt; letter-spacing: -0.035em; line-height: 1; }
.date-card .year { font-family: var(--font-mono); font-size: 20pt; font-weight: 600; color: var(--muted); margin-top: 10px; }
.date-card .what { font-size: 28pt; margin-top: 30px; line-height: 1.3; }
.date-card.today { background: transparent; box-shadow: 0 0 0 3px var(--rule) inset; }
.date-card.today .when { color: var(--muted); }
.date-card.last { background: var(--navy); box-shadow: none; color: var(--paper); }
.date-card.last .year { color: var(--muted-dark); }

/* Steps: a process in a row of cards; .ours is the step on the orange block */
.steps { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 18px; margin-top: 16px; }
.step { background: var(--surface); box-shadow: 0 0 0 3px var(--rule); border-radius: 24px; padding: 30px 26px 34px; display: flex; flex-direction: column; }
.step .n { font-family: var(--font-mono); font-size: 20pt; font-weight: 700; color: var(--muted); }
.step .name { font-family: var(--font-title); font-weight: 800; font-size: 30pt; line-height: 1.08; letter-spacing: -0.02em; margin-top: 14px; }
.step .what { font-size: 21pt; line-height: 1.3; margin-top: 18px; color: var(--muted); }
.step.ours { background: var(--orange); box-shadow: none; }
.step.ours .n, .step.ours .what { color: var(--navy); }
.reveal .slides section p.steps-note { font-size: 24pt; margin-top: 40px; color: var(--muted); }

/* Question cards: a coloured band over a question; a deck sets --band for its meanings */
.qcards { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 32px; margin-top: 12px; }
.qcard { background: var(--surface); box-shadow: 0 0 0 3px var(--rule); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.qcard .band { height: 120px; display: flex; align-items: center; padding: 0 40px; font-family: var(--font-mono); font-size: 20pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; background: var(--band, var(--navy)); color: var(--band-ink, var(--paper)); }
.qcard .q { font-family: var(--font-title); font-weight: 800; font-size: 44pt; line-height: 1.05; letter-spacing: -0.03em; padding: 36px 40px 0; }
.qcard .sub { font-size: 24pt; line-height: 1.3; padding: 22px 40px 40px; color: var(--muted); }

/* A list of statements, each on its own row */
.rows { display: grid; gap: 14px; margin-top: 8px; }
.rows > div { display: flex; align-items: center; gap: 28px; background: var(--surface); border-radius: 18px; padding: 20px 32px; font-size: 27pt; line-height: 1.25; }

/* Dots: a category mark, or a deck's own meaning through --dot */
.dot { display: inline-block; width: 0.9em; height: 0.9em; border-radius: 50%; flex: none; vertical-align: -0.12em; background: var(--dot, var(--navy)); }
.dot.cat-1 { --dot: var(--viz-cat-1); }
.dot.cat-2 { --dot: var(--viz-cat-2); }
.dot.cat-3 { --dot: var(--viz-cat-3); }
.dot.cat-4 { --dot: var(--viz-cat-4); }
.dot.cat-5 { --dot: var(--viz-cat-5); }

/* =========================
   SCREENSHOTS, SPLITS, QR CODES
   ========================= */
.screenshot-container {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 0 0 3px var(--rule);
  background: var(--surface);
  margin: 0;
}
.reveal .screenshot-container img { display: block; width: 100%; height: auto; max-width: 100%; max-height: none; margin: 0; }
.screenshot-caption,
.reveal .slides section p.slide-source {
  font-family: var(--font-mono);
  font-size: var(--fs-footer);
  line-height: 1.3;
  color: var(--muted);
  margin: 18px 0 0 0;
}

/* Text beside a screenshot or a QR code */
.split { display: grid; grid-template-columns: 1fr 1.18fr; gap: 80px; align-items: center; }
.split.wide-shot { grid-template-columns: 1fr 1.45fr; }
.split.qr-split { grid-template-columns: 1.5fr 1fr; }
.split .shot-col { display: flex; flex-direction: column; }
.split .shot-col .slide-source { text-align: right; }

/* An address as the browser shows it; <b> marks the part the slide is about */
.reveal .slides section p.address-bar { font-family: var(--font-mono); font-size: 24pt; font-weight: 600; background: var(--surface); box-shadow: 0 0 0 3px var(--rule); border-radius: 999px; padding: 14px 32px; margin-bottom: 24px; color: var(--navy); }
.address-bar b { background: var(--orange); border-radius: 0.14em; padding: 0 0.16em; }

.qr-col { display: flex; flex-direction: column; align-items: center; }
.reveal .slides section img.qr { width: 420px; height: 420px; margin: 0; background: #fff; border-radius: 24px; box-shadow: 0 0 0 3px var(--rule); padding: 16px; }
.reveal .slides section p.qr-caption { font-family: var(--font-mono); font-size: 18pt; margin: 20px 0 0; color: var(--muted); text-align: center; }
.qr-caption .nw { white-space: nowrap; }
/* On a navy slide: a white card bottom right */
.qr-corner { position: absolute; right: 96px; bottom: 120px; width: 400px; display: flex; flex-direction: column; align-items: center; z-index: 1; }
.reveal .slides section .qr-corner img.qr { width: 340px; height: 340px; box-shadow: none; }
.reveal .slides section .qr-corner p.qr-caption { color: var(--paper); font-size: 15pt; }

/* Data slide: a chart beside its finding */
.data-layout { display: grid; grid-template-columns: 3fr 2fr; gap: 64px; flex: 1; align-items: center; }
.data-narrative { font-size: var(--fs-body); line-height: 1.4; }

/* =========================
   TABLES
   ========================= */
.reveal .slides section table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: var(--fs-body-small);
  line-height: 1.25;
  margin: 8px 0 40px 0;
}
.reveal .slides section th {
  background: var(--navy);
  color: var(--paper);
  font-family: var(--font-title);
  font-weight: 700;
  text-align: left;
  padding: 16px 22px;
  border: none;
}
.reveal .slides section th:first-child { border-top-left-radius: 14px; }
.reveal .slides section th:last-child { border-top-right-radius: 14px; }
.reveal .slides section td {
  padding: 16px 22px;
  border: none;
  border-bottom: 2px solid var(--rule);
  background: var(--surface);
  vertical-align: top;
}
.reveal .slides section .compact td,
.reveal .slides section .compact th { padding: 9px 18px; }
.reveal .slides section .compact table { font-size: 17pt; }

/* =========================
   CALLOUTS
   ========================= */
/* Cards with a left edge: orange for the point to take away, hazard yellow for a caution */
.callout,
.alert {
  background: var(--surface);
  border-radius: 18px;
  border-left: 14px solid var(--orange);
  padding: 24px 32px;
  margin: 20px 0;
  font-size: var(--fs-body);
}
.alert { border-left-color: var(--hazard); }

/* =========================
   CODE
   ========================= */
.reveal .slides section code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--rule);
  padding: 0.04em 0.24em;
  border-radius: 0.18em;
  color: var(--navy);
}

.reveal .slides section pre {
  background: var(--navy);
  border-radius: 24px;
  padding: 32px 40px;
  width: 100%;
  box-sizing: border-box;
  box-shadow: none;
  margin: 8px 0 24px 0;
}

.reveal .slides section pre code {
  background: transparent;
  box-shadow: none;
  color: var(--paper);
  padding: 0;
  font-size: var(--fs-code);
  line-height: 1.5;
  max-height: none;
}

/* Syntax colours in the kit's dark tones: keywords and numbers on orange, the rest in
   paper and its muted shades (no theme from the highlight plugin is loaded) */
.reveal pre code.hljs { color: var(--paper); }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-number, .hljs-selector-tag, .hljs-meta { color: var(--orange); }
.hljs-keyword { font-weight: 700; }
.hljs-string, .hljs-attr, .hljs-attribute, .hljs-regexp, .hljs-symbol { color: var(--core-dark-muted); }
.hljs-comment, .hljs-quote { color: var(--core-dark-subtle); font-style: italic; }
.hljs-title, .hljs-function .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--paper); font-weight: 700; }
.hljs-variable, .hljs-params, .hljs-type, .hljs-property { color: var(--paper); }

/* =========================
   ANNOTATIONS AND DIAGRAMS
   ========================= */
.annotated { position: relative; display: inline-block; }
.annotation-circle { position: absolute; border: 5px solid var(--orange); border-radius: 50%; pointer-events: none; }
.annotation-arrow { position: absolute; color: var(--orange); font-size: 24pt; pointer-events: none; }

.entity-card { background: var(--surface); box-shadow: 0 0 0 3px var(--rule); border-radius: 18px; overflow: hidden; display: inline-block; }
.entity-card .entity-header { background: var(--navy); color: var(--paper); padding: 10px 18px; font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-body-small); }
.entity-card .entity-body { padding: 12px 18px; font-size: var(--fs-body-small); }

/* =========================
   SLIDE ART (data-art: terrain, contours, graticule)
   ========================= */
/* The deck's place behind a slide, full bleed and faint, so the slide's text stays on
   top; the build draws it from the place (see references/style-2026.md) */
.reveal .slides section > .art {
  position: absolute;
  inset: 0;
  width: 1920px;
  height: 1080px;
  z-index: -1;
  pointer-events: none;
  opacity: 0.4;
}
.reveal .slides section.title-slide > .art,
.reveal .slides section.section-slide > .art,
.reveal .slides section.subsection-slide > .art { opacity: 0.8; }
.reveal .slides section > .art svg { width: 100%; height: 100%; color: var(--ink); }
.reveal .slides section[data-art] { isolation: isolate; }
/* The data's credit (OpenStreetMap's, under roads), small over the footer's right end; placed from the canvas's top,
   since a content slide is only as tall as its content */
.reveal .slides section > p.art-credit {
  position: absolute;
  right: 96px;
  top: 924px;
  margin: 0;
  line-height: 1;
  font-family: var(--font-mono);
  font-size: 12pt;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--subtle);
}

/* =========================
   FOOTER
   ========================= */
/* bnhr.xyz left, the page number in the middle, the horizontal logo right. Straight: the slanted
   band is for posts and documents, never decks (user, 2026-10-27) */
.global-footer .url {
  font-family: var(--font-title);
  font-weight: 700;
  font-size: var(--fs-footer);
  color: var(--navy);
}
.global-footer .page-number {
  font-family: var(--font-mono);
  font-size: var(--fs-footer);
  color: var(--muted);
}
.global-footer .footer-logo { width: 140px; height: auto; }

/* Navigation is the keyboard or a clicker; the arrows would sit on the footer logo */
.reveal .controls { display: none !important; }
.reveal .progress { color: var(--orange); }

/* =========================
   FRAGMENTS AND PRINT
   ========================= */
.reveal .slides section .fragment.highlight-orange.visible { background: var(--orange); color: var(--navy); }

@media print {
  .screenshot-container { box-shadow: 0 0 0 2px var(--rule); }
}


/* ===============================================================
   BNHR 2026 deck style, map sheet variant (style: 2026/map-sheet)
   ===============================================================
   The 2026 deck dressed as the bnhr.xyz map sheet (the hub's direction B and the
   docs template's map-sheet copy). It adds dress only; every colour, face and size
   comes from ../theme.css and the web kit, and a variant never sets them (see
   references/style-2026.md).

   Navy slides (title, sections): the deck's place as a printed sheet — hillshade,
   contours and coast in a neatline, the graticule's ticks and labels, the spot
   height, the scale box and the imprint — drawn by the build from sheet_map.py, with
   the slide's text in a title block over the map's right side.
   Light slides: a hairline frame with corner crosses and a sheet head (the section
   and "Sheet 04 / 13"), mono labels, numbers in a box. No terrain behind text unless
   a slide asks for it (data-art).
   =============================================================== */

/* =========================
   NAVY SLIDES: THE SHEET AND ITS TITLE BLOCK
   ========================= */
.reveal .slides section.title-slide,
.reveal .slides section.section-slide,
.reveal .slides section.subsection-slide {
  /* sheet_map.py's names for the page's tones */
  --bg: var(--navy);
  --block: var(--orange);
  --display: var(--font-title);
  --mono: var(--font-mono);
  justify-content: flex-start;
  padding: 196px 168px 200px 948px;
}

.reveal .slides section > .sheet {
  position: absolute;
  inset: 0;
  width: 1920px;
  height: 1080px;
  z-index: 0;
  pointer-events: none;
}
.reveal .slides section > .sheet .probe-mark { display: none; }  /* the readout is the spot height's */

/* The title block: navy, framed in paper, over the map's right side */
.reveal .slides section.title-slide::before,
.reveal .slides section.section-slide::before,
.reveal .slides section.subsection-slide::before {
  content: "";
  position: absolute;
  left: 892px;
  top: 128px;
  width: 900px;
  height: 804px;
  box-sizing: border-box;
  background: var(--navy);
  border: 3px solid var(--paper);
  z-index: 1;
}
.reveal .slides section.title-slide > *:not(.sheet):not(.qr-corner):not(.tagline),
.reveal .slides section.section-slide > *:not(.sheet):not(.qr-corner),
.reveal .slides section.subsection-slide > *:not(.sheet):not(.qr-corner) { position: relative; z-index: 2; }
.reveal .slides section > .sheet p.imprint { font-size: 15px; line-height: 1; margin: 0; }

/* The square logo in the title block's lower right */
.reveal .slides section.title-slide::after,
.reveal .slides section.section-slide::after,
.reveal .slides section.subsection-slide::after {
  top: auto;
  right: 176px;
  bottom: 196px;
  width: 112px;
  height: 112px;
  z-index: 2;
}

/* The block's head: the kicker over a rule */
.reveal .slides section.title-slide .project-context,
.reveal .slides section.section-slide .section-label,
.reveal .slides section.subsection-slide .section-label {
  color: var(--paper);
  padding-bottom: 22px;
  border-bottom: 1.5px solid var(--core-dark-rule);
  margin: 0 0 44px 0;
}

.reveal .slides section.title-slide h1 { font-size: 76pt; line-height: 1.02; max-width: none; margin: 0 0 36px 0; }
.reveal .slides section.section-slide h1 { font-size: 72pt; line-height: 1.02; max-width: none; }
.reveal .slides section.subsection-slide h1 { font-size: 60pt; max-width: none; }
.reveal .slides section.title-slide .subtitle { font-size: 26pt; line-height: 1.3; }
.reveal .slides section.title-slide .tagline { position: absolute; z-index: 2; left: 948px; bottom: 214px; margin: 0; font-size: 24pt; }

/* A navy slide's QR code sits in the title block's foot, left of the logo */
.reveal .slides section .qr-corner { right: auto; left: 948px; bottom: 196px; width: auto; align-items: flex-start; z-index: 2; }
.reveal .slides section .qr-corner img.qr { width: 260px; height: 260px; }

/* =========================
   LIGHT SLIDES: FRAME, CROSSES, SHEET HEAD
   ========================= */
.reveal .slides section.content-slide,
.reveal .slides section.toc-slide {
  padding: 164px 168px 156px 120px;
}

/* The hairline frame, 40px in from the canvas's edges (a content slide is only as tall as
   its content, so the frame is sized on the canvas, not the slide) */
.reveal .slides section.content-slide::before,
.reveal .slides section.toc-slide::before {
  content: "";
  position: absolute;
  left: 40px;
  top: 40px;
  width: 1840px;
  height: 1000px;
  box-sizing: border-box;
  border: 1.5px solid var(--rule);
  pointer-events: none;
}

/* Crosses on the frame's corners */
.reveal .slides section > i.cross { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; pointer-events: none;
  background: linear-gradient(var(--navy), var(--navy)) center / 2px 100% no-repeat, linear-gradient(var(--navy), var(--navy)) center / 100% 2px no-repeat; }
.reveal .slides section > i.cross.tl { left: 40.75px; top: 40.75px; }
.reveal .slides section > i.cross.tr { left: 1879.25px; top: 40.75px; }
.reveal .slides section > i.cross.bl { left: 40.75px; top: 1039.25px; }
.reveal .slides section > i.cross.br { left: 1879.25px; top: 1039.25px; }

/* The sheet head: the section on the left, "Sheet 04 / 13" on the right, over a hairline */
.reveal .slides section > .sheet-head {
  position: absolute;
  left: 40px;
  right: 40px;
  top: 40px;
  height: 64px;
  box-sizing: border-box;
  padding: 0 40px 0 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1.5px solid var(--rule);
  font-family: var(--font-mono);
  font-size: 15pt;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--subtle);
}
.reveal .slides section > .sheet-head span:last-child { color: var(--navy); font-weight: 700; }

/* The footer sits inside the frame; the sheet head carries the number. The square logo (the
   build's footer logo for this style) keeps the sheet head's 40px inset from the frame's right
   and bottom edges, as the navy slides' logo keeps one in the title block; bnhr.xyz sits on its foot */
.global-footer { --footer-bottom: 80px; left: 120px; right: 80px; align-items: flex-end; }
.global-footer .footer-logo { width: 96px; margin: 0; }  /* not reveal.js's 20px image margin */
.global-footer .page-number { display: none; }
.reveal .slides section > p.art-credit { top: 984px; right: 200px; }  /* on the logo's foot, left of it */

/* =========================
   LABELS AND NUMBERS IN MONO (the docs template's map-sheet copy)
   ========================= */
.reveal .slides section h3 {
  font-family: var(--font-mono);
  font-size: 22pt;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.reveal .slides section th {
  font-family: var(--font-mono);
  font-size: 16pt;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.reveal .slides section ol li::before {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.82em;
  top: 0.1em;
}

/* Section numbers in a box: 01, 02 */
.reveal .slides section.toc-slide .toc-list li { padding-left: 2.6em; }
.reveal .slides section.toc-slide .toc-list li::before {
  top: 0.12em;
  font-size: 0.56em;
  color: var(--navy);
  border: 2px solid var(--navy);
  padding: 0.14em 0.36em;
  line-height: 1;
}

/* Cards take the sheet's straighter corners */
.reveal .slides section { --radius: 14px; }

  </style>
</head>

# How the next three days *work*.

Note:
Ten minutes on how the course works, then a short test, then NRDC has the floor.

## Every application needs *four* outputs that agree.

<div class="steps" style="--n: 4">
<div class="step"><div class="n">Output 1</div><div class="name">The map</div><div class="what">The subject area in the prescribed layout, with its signatories.</div></div>
<div class="step"><div class="n">Output 2</div><div class="name">Shapefiles</div><div class="what">The corners as points, the boundary as a polygon, with the prescribed attributes.</div></div>
<div class="step"><div class="n">Output 3</div><div class="name">Technical description</div><div class="what">Bearings and distances, with the tie point and the tie line.</div></div>
<div class="step"><div class="n">Output 4</div><div class="name">Corner coordinates</div><div class="what">The northing and easting of every corner.</div></div>
</div>

<p class="steps-note">Most returned applications fail on agreement, not on any one output.</p>

Note:
The Guide for the Standard Mapping, the FMB memorandum of 15 February 2024, asks for four digital outputs with every forestry tenure application. They are not four separate tasks: they are four views of the same area. The corners in the point shapefile are the corners in the technical description; the polygon is the area on the map; the area on the map is the area in the attribute table. When an application comes back, it is usually because two of these disagree: a technical description that doesn't close, an area that differs between the map and the table, coordinates that don't match the shapefile. Everything this week builds the four outputs from one source, so they can't disagree, and Day 3 checks that they don't.

Every exercise works on one application: the Bagong Gubat Agroforestry Cooperative, about 23.76 hectares in General Nakar, Quezon, in PRS 1992 Zone III. The applicant, the BLLM it is tied to and the tenure layers are made up for the course, so we can break things freely. This is the map you will have made by the end of Day 2. On Day 3 a second application, Luntiang Bundok, comes in to map both with one layout, and a returned application gives us something to cross-check. On the afternoon of Day 3 we switch to one of your own applications.

## Three days, one application from plot to *final*.

<div class="steps" style="--n: 4">
